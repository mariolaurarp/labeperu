<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #0078D7;
            color: white;
            padding: 20px;
        }

        main {
            margin-top: 50px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0078D7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido</h1>
    </header>

    <main>
        <h2>Mi primer Index</h2>
        <p>Esta es una página HTML sencilla.</p>

        <a href="#" class="btn">Ingresar</a>
    </main>

</body>
</html>
